<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Кирилл ❤️ Диана</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: linear-gradient(135deg, #ffe5ec, #fff5f7);
    color: #3b2028;
    text-align: center;
}

.container {
    max-width: 600px;
    margin: auto;
    padding: 30px 18px 50px;
}

h1 {
    font-size: 34px;
    margin-bottom: 8px;
}

.date {
    color: #9b6673;
    font-size: 17px;
    margin-bottom: 30px;
}

.counter {
    background: rgba(255,255,255,0.75);
    border-radius: 22px;
    padding: 18px;
    margin-bottom: 25px;
    box-shadow: 0 8px 25px rgba(100,40,60,0.1);
}

.counter b {
    font-size: 25px;
}

.message {
    background: white;
    border-radius: 22px;
    padding: 25px 20px;
    line-height: 1.6;
    font-size: 17px;
    box-shadow: 0 8px 25px rgba(100,40,60,0.1);
    margin-bottom: 25px;
}

.photos {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    margin-bottom: 30px;
}

.photo {
    height: 180px;
    border-radius: 18px;
    background: #f8cbd6;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #8d5362;
    font-size: 16px;
    overflow: hidden;
}

.photo img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

button {
    border: none;
    background: #e75475;
    color: white;
    padding: 14px 25px;
    border-radius: 30px;
    font-size: 17px;
    cursor: pointer;
    box-shadow: 0 7px 18px rgba(200,60,90,0.25);
}

.heart {
    position: fixed;
    pointer-events: none;
    animation: fly 2s ease-out forwards;
    font-size: 25px;
}

@keyframes fly {
    0% {
        transform: translateY(0) scale(1);
        opacity: 1;
    }
    100% {
        transform: translateY(-250px) scale(1.5);
        opacity: 0;
    }
}

@media (max-width: 400px) {
    h1 {
        font-size: 29px;
    }

    .photo {
        height: 150px;
    }
}
</style>
</head>

<body>

<div class="container">

    <h1>Кирилл ❤️ Диана</h1>

    <div class="date">
        27.09.2026
    </div>

    <div class="counter">
        <div>Мы вместе уже</div>
        <b id="days">0 дней</b>
    </div>

    <div class="photos">

        <div class="photo">📸 Фото 1</div>

        <div class="photo">📸 Фото 2</div>

        <div class="photo">📸 Фото 3</div>

        <div class="photo">📸 Фото 4</div>

    </div>

    <div class="message">
        Я просто хотел сделать для тебя что-то,
        что останется на память. Собрал сюда наши
        моменты, потому что каждый из них для меня
        особенный. И это только начало нашей истории. ❤️
    </div>

    <button onclick="makeHearts()">
        Нажми ❤️
    </button>

</div>

<script>

const startDate = new Date(2026, 8, 27);
const today = new Date();

const difference = today - startDate;
const days = Math.max(0, Math.floor(difference / 86400000));

document.getElementById("days").textContent =
    days + (days === 1 ? " день" : " дней");


function makeHearts() {

    for (let i = 0; i < 15; i++) {

        const heart = document.createElement("div");

        heart.className = "heart";
        heart.textContent = "❤️";

        heart.style.left =
            Math.random() * 100 + "vw";

        heart.style.top =
            (60 + Math.random() * 30) + "vh";

        heart.style.animationDelay =
            Math.random() * 0.5 + "s";

        document.body.appendChild(heart);

        setTimeout(() => {
            heart.remove();
        }, 2500);
    }
}

</script>

</body>
</html>
